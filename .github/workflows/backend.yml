name: backend

# 백엔드(Spring 애플리케이션 + matching-engine) 빌드·테스트.
# 프론트엔드와 문서만 바뀐 경우에는 돌지 않는다. 프론트엔드는 frontend.yml이 담당한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Gradle 캐시와 wrapper 검증을 함께 처리한다.
      - uses: gradle/actions/setup-gradle@v6

      # build = 컴파일 + 테스트(Testcontainers: PostgreSQL·Redis·Kafka) + verifyNoSpring
      - run: ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            matching-engine/build/reports/tests/
          retention-days: 7
